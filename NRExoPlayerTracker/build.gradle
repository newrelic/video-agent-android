plugins {
    id 'com.android.library'
    id 'maven-publish'
}
android {
    compileSdk 34
    

    defaultConfig {
        versionCode 6
        versionName GLOBAL_VERSION_NAME
        minSdk 24
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("long", "VERSION_CODE", (defaultConfig.versionCode ?: 0).toString())
            buildConfigField("String","VERSION_NAME","\"${defaultConfig.versionName}\"")
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("long", "VERSION_CODE", (defaultConfig.versionCode ?: 0).toString())
            buildConfigField("String","VERSION_NAME","\"${defaultConfig.versionName}\"")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.newrelic.videoagent.exoplayer'
    publishing { singleVariant('release') }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation project(path: ':NewRelicVideoCore')
    // Both player SDKs are compileOnly — NOT bundled in the AAR.
    // The host app provides its own player SDK dependency:
    //   ExoPlayer customers:  implementation 'androidx.media3:media3-exoplayer:1.2.0'
    //   THEOplayer customers: implementation 'com.theoplayer.theoplayer-sdk-android:core:+'
    // This keeps the AAR lean regardless of which player the customer uses.
    compileOnly 'androidx.media3:media3-exoplayer:1.2.0'
    compileOnly 'androidx.media3:media3-exoplayer-ima:1.2.0'
    // THEOplayer tracker lives in NRTHEOPlayerTracker — no THEOplayer dep needed here
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.newrelic'
                artifactId = 'NRExoPlayerTracker'
                version = "${android.defaultConfig.versionName}"
            }
        }
    }

}
