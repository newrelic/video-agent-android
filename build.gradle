// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Necessary??
apply plugin: 'maven-publish'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.theoplayer.com/releases"
            credentials {
                username = localProperties.getProperty('theoplayer.username', '')
                password = localProperties.getProperty('theoplayer.secret', '')
            }
        }
    }
    configurations.all {
        resolutionStrategy {
            // Force stdlib to match kotlin-gradle-plugin version to prevent two issues:
            // 1. Duplicate class errors when old (jdk7/jdk8) and new (merged) stdlib coexist
            // 2. Runtime NoSuchMethodError if stdlib is forced lower than the compiler version
            // At 1.9.22, jdk7/jdk8 artifacts are empty shims — no duplicates and compiler-safe.
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

