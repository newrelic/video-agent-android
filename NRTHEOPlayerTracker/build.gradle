plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdk 36

    defaultConfig {
        versionCode 1
        versionName GLOBAL_VERSION_NAME
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("long", "VERSION_CODE", (defaultConfig.versionCode ?: 0).toString())
            buildConfigField("String", "VERSION_NAME", "\"${defaultConfig.versionName}\"")
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("long", "VERSION_CODE", (defaultConfig.versionCode ?: 0).toString())
            buildConfigField("String", "VERSION_NAME", "\"${defaultConfig.versionName}\"")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    namespace 'com.newrelic.videoagent.theoplayer'
    publishing { singleVariant('release') }
}

dependencies {
    // THEOplayer is compileOnly: the host app owns the SDK and its license configuration.
    // This keeps the AAR lean and avoids duplicate class conflicts at runtime.
    compileOnly "com.theoplayer.theoplayer-sdk-android:core:11.9.0"

    implementation project(path: ':NewRelicVideoCore')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation "com.theoplayer.theoplayer-sdk-android:core:11.9.0"
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.newrelic'
                artifactId = 'NRTHEOPlayerTracker'
                version = "${android.defaultConfig.versionName}"
            }
        }
    }
}
