name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

jobs:
  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Run only if merged AND has 'release' label
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release files
        run: ./gradlew --no-daemon publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/m2"

      - name: Collect files and write checksums
        run: |
          mkdir -p release
          find "$RUNNER_TEMP/m2/com/github/newrelic" -type f \( -name '*.aar' -o -name '*.pom' -o -name '*.module' \) -exec cp {} release/ \;
          cd release
          # Written outside release/ so the list does not list itself.
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Create Release and Tag
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Extract Version
          VERSION=$(grep "^GLOBAL_VERSION_NAME=" gradle.properties | cut -d'=' -f2)

          if [ -z "$VERSION" ]; then
            echo "Error: Could not detect version from gradle.properties."
            exit 1
          fi

          echo "Detected Version: $VERSION"
          TAG_NAME="v$VERSION"
          
          # 2. Extract Changelog for this version
          # We initialize NOTES as empty
          NOTES=""
          
          if [ -f CHANGELOG.md ]; then
            echo "CHANGELOG.md found. Extracting notes for $VERSION..."
            # This command extracts the text between the current version header and the next one
            NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$ d')
          else
            echo "Warning: CHANGELOG.md not found."
          fi
          
          # 3. Log extracted notes
          echo "Extracted notes:"
          echo "$NOTES"

          # 4. Create the GitHub Release AND Tag
          # We use the extracted "$NOTES" here
          # Draft first, upload every file, then publish: files cannot be added once published
          # (immutable releases).
          gh release create "$TAG_NAME" \
            --draft \
            --title "$TAG_NAME" \
            --notes "$NOTES" \
            --target ${{ github.base_ref }}
          gh release upload "$TAG_NAME" release/*
          gh release edit "$TAG_NAME" --draft=false

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Trigger Release Notes Docs PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.create_release.outputs.tag }}
        run: |
          gh workflow run release-notes-docs-pr.yml --ref master --field tag="$RELEASE_TAG" --field dry_run=false
          echo "Triggered release-notes-docs-pr.yml for $RELEASE_TAG"
